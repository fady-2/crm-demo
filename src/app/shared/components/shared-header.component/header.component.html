  <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
    <div class="header-text">
      <h1 class="h3 fw-bold text-dark mb-1">{{ headerName() }}</h1>
      <p class="text-muted small mb-0">{{ headerDescription() }}</p>
    </div>
    @if (headerActions()) {
      <div class="header-buttons d-flex align-items-center gap-2">
        @for (action of headerActions(); track action) {
          <p-button [label]="action.label" [icon]="action.icon" [severity]="action.severity" (onClick)="actionClicked.emit(action)"></p-button>
        }
      </div>
    }
  </header>
