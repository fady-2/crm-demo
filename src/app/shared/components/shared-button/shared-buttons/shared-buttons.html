<button
[type]="type"
[style.background-color]="backgroundColor"
[style.color]="textColor"
[class]="className"
 [style.width]="width"
   [style.border-radius]="borderRadius"

  [style.height]="height"
    [style.border-color]="borderColor"

>
@if (icon){
    <img [src]="icon" alt="icon" width="17" height="16" class="mt-1"/>
}
{{text}}


</button>
