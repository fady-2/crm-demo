<div class="rounded-3 border bg-white shadow-sm overflow-hidden">
  <p-table
    [value]="data()"
    [loading]="loading()"
    [columns]="columns()"
    styleClass="p-datatable-sm">

    <ng-template #header let-columns>
      <tr>
        @for (col of columns; track col.key) {
          <th class="small text-uppercase text-secondary bg-light table-header-tracking">{{ col.label }}</th>
        }
        @if (actionsTemplate()) {
          <th class="small text-uppercase text-secondary bg-light text-end table-header-tracking">Actions</th>
        }
      </tr>
    </ng-template>
    <ng-template #body let-rowData let-columns="columns">
      <tr>
        @for (col of columns; track col.key) {
          <td class="small">{{ rowData[col.key] }}</td>
        }
        @if (actionsTemplate()) {
          <td class="small text-end">
            <ng-container *ngTemplateOutlet="actionsTemplate(); context: { $implicit: rowData }"></ng-container>
          </td>
        }
      </tr>
    </ng-template>
  </p-table>
</div>
