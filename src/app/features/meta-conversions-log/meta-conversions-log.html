<div class="header-text d-flex align-items-center justify-content-between">
  <h3 class="header-title">Meta Conversions Log</h3>
  <button class="d-flex align-items-center gap-2">
    <i class="bi bi-funnel fw-bold"></i>Filter<i class="bi bi-chevron-down fw-bold"></i>
  </button>
</div>
<p-table
  [value]="data"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 20]"
  [columns]="columns"
>
  <ng-template #header let-columns>
    <tr>
      @for (col of columns; track col.key) {
        <th>
          {{ col.label }}
        </th>
      }
    </tr>
  </ng-template>
  <ng-template #body let-rowData let-columns="columns">
    <tr class="text-center">
      @for (col of columns; track col.key) {
        <td>{{ rowData[col.key] }}</td>
      }
    </tr>
  </ng-template>
</p-table>
